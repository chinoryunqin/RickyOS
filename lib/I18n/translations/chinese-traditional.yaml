STR_SGM_RULES_1: "基本玩法 · 1/3\n\n黑棋先手，任意方向連成五子或更多即獲勝，不設禁手。\n\n每回合落子或發動一個技能。初始 3 能量，上限 8；普通落子增加 1 能量。\n\n點棋盤定位，再確認落子。選單裡可以選技能或悔棋。返回可取消待發動的技能，不扣能量。\n\n棋盤滿或累計 400 次行動判和。技能模式與傳統模式分別存檔。"
STR_SGM_RULES_2: "普通技能 · 2/3\n\n飛沙走石（3 能量）：移除對方一枚棋子。\n\n偷樑換柱（4 能量）：將對方一枚棋子變為己方顏色。\n\n移花接木（2 能量）：選己方棋子並確認，再選空位並確認移動。\n\n這三個技能發動後，需要自己再完成兩次行動才可再次使用。選錯目標、取消操作不扣能量，不計回合。"
STR_SGM_RULES_3: "強力技能 · 3/3\n\n靜如止水（5）：落一子，對方跳過回合，自己繼續。\n\n兩極反轉（6）：交換全部棋子顏色，場上須有雙方棋子。\n\n力拔山兮（8）：清空指定 3×3 區域，己方棋子也會移除。\n\n以上技能每位玩家每局各限一次。\n\n休養生息：恢復 3 能量並結束回合。悔棋還原能量、冷卻和技能次數，僅保留本次進入後的最近 8 次行動。"
