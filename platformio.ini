[platformio]
default_envs = rickyos_readpico
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.6.5

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags =
  --enable=all
  --check-level=exhaustive
  --suppress=missingIncludeSystem
  --suppress=missingInclude
  --suppress=unusedFunction
  --suppress=unmatchedSuppression
  --suppress=*:*/.pio/*
  ; The SDK is maintained separately; keep this check scoped to reader-owned code.
  --suppress=*:*/freeink-sdk/*
  ; Analyzer status output is not a source-code defect.
  --suppress=checkersReport
  --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Keep FAT table sectors separate from file/directory data on ESP32.
# Requires scripts/patch_sdfat.py; reserves one additional inline sector cache.
  -DUSE_SEPARATE_FAT_CACHE=1
# SdFat transfers SPI a byte at a time on ESP32: SdFatConfig.h defaults
# USE_SPI_ARRAY_TRANSFER to 0 for every target but RP2040 and the UNO R4, and each
# Arduino transfer(uint8_t) writes the data register, starts the transfer and spins.
# 1 routes through transfer(buf, count) -> transferBytes() -> spiTransferBytesNL(),
# which batches into the SPI FIFO: ~3x on SD reads, at the cost of a 512-byte stack
# buffer on the send path. Inert on SDMMC boards, which bypass SdFat's SPI driver.
  -DUSE_SPI_ARRAY_TRANSFER=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
# FreeInkFont optional FreeType modules. The auto-hinter (~50KB text, PSRAM
# boards only via the vector-font gate) is REQUIRED by the BW-aware 2-bit
# quantizer in TtfEpdFont: with the ink threshold at 50% coverage, unhinted
# thin strokes that straddle pixel columns drop below threshold and break up;
# Light hinting snaps stems to full-coverage pixels so they survive. (An
# earlier "no improvement" A/B was confounded by the old always-ink quantizer
# flooding the differences.) Still OFF: the B/W raster (_MONOCHROME, ~5KB) is
# dead while every TtfEpdFont::load() is 2-bit; psnames (_PSNAMES, ~64KB)
# only serves glyph-NAME lookups a codepoint-driven renderer never makes;
# gzip (_GZIP, ~13KB) only decompresses .gz/WOFF, and the registry accepts
# .ttf/.otf/.ttc.
  -DFREEINK_FONT_ENABLE_AUTOHINT=1
  -DFREEINK_NET_WOLFSSL=1
  ; Content protection. Decrypt-on-read + the crypto primitives the browser
  ; account plugin drives (activation runs in the browser; the device does the
  ; crypto). KEY_GEN = RSA keypair generation; WC_RC2 = the legacy PBE-SHA1-RC2
  ; cipher the PKCS#12 signing bundle uses. Inflate binds to CrossPoint's miniz.
  -DFREEINK_CONTENT_WOLFSSL=1
  -DCONTENT_EXTERNAL_MINIZ=1
  -DWOLFSSL_KEY_GEN
  -DWC_RC2
  ; Force software RSA. The Espressif wolfSSL port hardcodes ESP_HW_RSAMAX_BIT
  ; at 4096, but the ESP32-C3 MPI peripheral only handles operands up to
  ; 3072-bit — so encrypting to a 4096-bit account/auth certificate on the HW
  ; path returns MP_EXPTMOD_E (-112) instead of falling back. Software
  ; fp_exptmod handles up to FP_MAX_BITS/2; RSA is only used at activation and
  ; for the 1024-bit content-key unwrap, so the speed cost is irrelevant.
  -DNO_WOLFSSL_ESP32_CRYPT_RSA_PRI
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC and RSA (sp_c32.c). Fast-math otherwise
# heap-allocates many FP_MAX_BITS temporaries during key exchange and RSA
# CertificateVerify. SP uses fixed-width workspaces; with WOLFSSL_SMALL_STACK,
# RSA-2048/4096 public operations need one temporary block of about 1.4/2.8KB.
# SP_SMALL trades large precomputed tables for flash, and SP_4096 covers the
# largest RSA public key accepted by the existing FP_MAX_BITS=8192 setting.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_HAVE_SP_RSA
  -DWOLFSSL_SP_SMALL
  -DWOLFSSL_SP_4096
# SecureClient is the sole TLS fragment policy owner and requests 2KB records.
# This is a request, not a guarantee: peers may ignore the extension.
  -DHAVE_MAX_FRAGMENT
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
  ; Single firmware: CJK parsing/rendering and regional apps are always built.
  -DENABLE_CHINESE_VERSION=1

build_unflags =
  -std=gnu++11
  -fexceptions

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; UI languages compiled into the firmware, as comma-separated codes from lib/I18n/translations
; (e.g. "en,de,fr"). English is always included. Languages left out are not offered in the
; language picker; a device whose saved language is not built in falls back to English.
custom_i18n_builtin_langs = all

extra_scripts =
  pre:scripts/patch_pioarduino_cache.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/build_userguide.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/patch_sdfat.py
  post:scripts/register_unit_tests_target.py
  post:scripts/patch_arduino_rom_libc.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  MemoryManager=symlink://freeink-sdk/libs/hardware/MemoryManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  JsonSax=symlink://freeink-sdk/libs/network/JsonSax
  CatalogList=symlink://freeink-sdk/libs/network/CatalogList
  ContentProtection=symlink://freeink-sdk/libs/book/ContentProtection
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  ; Standalone FreeType/stb TTF engine backing lib/EpdFont/TtfEpdFont (runtime
  ; .ttf/.otf rendering). Vendors only stb_truetype + FreeType (no expat), so it
  ; does not hit the FreeInkBook duplicate-XML_* symbol problem.
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  bblanchon/ArduinoJson @ 7.4.2
  ; Pinned for the reviewed cache patches in scripts/sdfat_patches/.
  greiman/SdFat @ 2.3.1
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  knolleary/PubSubClient @ ^2.8
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

; The standard firmware profiles reclaim heap by rebuilding the Arduino core.
; USB-OTG (FREEINK_CAP_USB_MSC) profiles like the X4 Pro and Paper Mono
; intentionally do not inherit this section: they need PioArduino's complete
; prebuilt TinyUSB component graph, which the custom core rebuild omits.
[firmware_tuned]
; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; esp-modbus requires its API blocking limit to cover the response timeout.
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  !python3 -c "import platform; print('-lcrypto' if platform.system() == 'Linux' else '')"
  -Wno-narrowing
  -DFREEINK_CONTENT_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_KEY_GEN
  -DWC_RC2
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
  -DSIMULATOR
  -DFREEINK_DEVICE_X4CLASSIC=0
  -DCROSSPOINT_EMULATED=1
  -DCROSSPOINT_SIMULATOR_OTA_CHANNELS=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_CHINESE_VERSION=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
  -Ilib/hal
build_unflags =
  -std=gnu++11
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets
extra_scripts =
  pre:.pio/libdeps/$PIOENV/simulator/skip_device_content_protection.py
  pre:scripts/build_html.py
  pre:scripts/build_userguide.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
lib_deps =
  ContentProtection=symlink://freeink-sdk/libs/book/ContentProtection
  wolfssl/Arduino-wolfSSL @ 5.7.2
  JsonSax=symlink://freeink-sdk/libs/network/JsonSax
  CatalogList=symlink://freeink-sdk/libs/network/CatalogList
  simulator=https://github.com/0x1abin/crosspoint-simulator.git#58b6694dab19a626f36486a0c5f1616110deab7f
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  knolleary/PubSubClient @ 2.8

; Common host dependencies; target-specific controller/allocator flags stay below.
[ble_host]
build_flags =
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DFREEINK_BLE_HID_SHOW_UNNAMED_DEVICES=0
lib_deps =
  ${base.lib_deps}
  h2zero/NimBLE-Arduino @ 2.3.8
extra_scripts =
  ${base.extra_scripts}
  pre:scripts/patch_ble_keyboard_host.py

; S3 host settings shared by every hardware firmware flavor.
[s3_ble]
build_flags =
  ${ble_host.build_flags}
  -Wl,--wrap=xTaskCreatePinnedToCore
lib_deps = ${ble_host.lib_deps}
extra_scripts = ${ble_host.extra_scripts}

[s3_ble_psram]
lib_deps = ${s3_ble.lib_deps}
extra_scripts =
  ${s3_ble.extra_scripts}
  pre:scripts/configure_nimble_psram.py
build_flags =
  ${s3_ble.build_flags}
  -DCROSSPOINT_BLE_HOST_PSRAM=1

; Only custom-core S3 profiles use controller-only IDF Bluetooth. USB profiles
; retain the prebuilt dio_opi TinyUSB component graph.
[s3_ble_controller]
custom_sdkconfig =
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLUEDROID_ENABLED=n
  CONFIG_BT_NIMBLE_ENABLED=n
  CONFIG_BT_CONTROLLER_ONLY=y
  CONFIG_BT_CONTROLLER_ENABLED=y
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=n
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=n
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  CONFIG_BT_NIMBLE_MAX_CCCDS=2
  CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=23
  CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=6
  CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=6
  CONFIG_BT_NIMBLE_ACL_BUF_COUNT=6
  CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=12
  CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=6
  CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=12
  CONFIG_BT_NIMBLE_ATT_MAX_PREP_ENTRIES=4
  CONFIG_BT_CTRL_BLE_MAX_ACT=3
  CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=50
  CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=10
  CONFIG_BLE_MESH=n

[env:simulator_eego_a4]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_EEGO_A4

[env:simulator_readpico]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_READPICO
  -DCROSSMUX_UI_PROFILE_HIGH_DPI

[env:simulator_rickyos]
extends = env:simulator_readpico
extra_scripts =
  ${env:simulator.extra_scripts}
  post:scripts/patch_rickyos_simulator.py
build_src_filter =
  ${env:simulator.build_src_filter}
  ${rickyos_app_profile.build_src_filter}
build_flags =
  ${env:simulator_readpico.build_flags}
  ${rickyos_flash_trim.build_flags}
  -DRICKYOS_PRODUCT=1
  -DRICKYOS_USB_PREVIEW=1
  -DCROSSPOINT_PRODUCT_NAME=\"RickyOS\"
custom_i18n_builtin_langs = ${rickyos_flash_trim.custom_i18n_builtin_langs}

[env:simulator_rickyos_eego_a4]
extends = env:simulator_eego_a4
extra_scripts =
  ${env:simulator.extra_scripts}
  post:scripts/patch_rickyos_simulator.py
build_src_filter =
  ${env:simulator.build_src_filter}
  ${rickyos_app_profile.build_src_filter}
build_flags =
  ${env:simulator_eego_a4.build_flags}
  ${rickyos_flash_trim.build_flags}
  -DRICKYOS_PRODUCT=1
  -DCROSSPOINT_PRODUCT_NAME=\"RickyOS\"
custom_i18n_builtin_langs = ${rickyos_flash_trim.custom_i18n_builtin_langs}

; --- EEGO A4 — ESP32-S3 N16R8, 768x552 UC8279C + GSLX680 --------------------
; Experimental hardware target distributed through the Nightly channel only.
[eego_a4_hardware]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
lib_deps = ${s3_ble_psram.lib_deps}
extra_scripts = ${s3_ble_psram.extra_scripts}
build_flags =
  ${base.build_flags}
  ${s3_ble_psram.build_flags}
  -DFREEINK_DEVICE_EEGO_A4=1
  -DBOARD_HAS_PSRAM
  ; The A4's frontlight is an LM3630A, whose two current sinks give it a real
  ; colour-temperature channel (see BoardConfig::hasColorTemperatureFrontlight).
  ; The SDK's FREEINK_CAP_WARMLIGHT default only lists the PWM warm-light boards,
  ; so on this target the warmth entry was left out of the settings list — and
  ; the settings list is what gets serialized, which is why brightness persisted
  ; while colour temperature never did. Declare the capability for this target.
  -DFREEINK_CAP_WARMLIGHT=1
; WeRead's network steps (TLS handshake + JSON decode) run on the Arduino
; loop task; the 8KB default stack overflows there (observed crashes entering
; WeRead on the A4). Give the loop task 16KB like the render task.
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  ${s3_ble_controller.custom_sdkconfig}

; RickyOS 1.2 on EEGO A4. Hardware stays eego_a4; this only adds the product trim.
[env:rickyos_eego_a4]
extends = eego_a4_hardware
extra_scripts =
  ${eego_a4_hardware.extra_scripts}
build_src_filter =
  ${base.build_src_filter}
  ${rickyos_app_profile.build_src_filter}
build_flags =
  ${eego_a4_hardware.build_flags}
  ${rickyos_flash_trim.build_flags}
  -DRICKYOS_PRODUCT=1
  -DCROSSPOINT_PRODUCT_NAME=\"RickyOS\"
  -DCROSSPOINT_VERSION=\"${rickyos.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; boot/reader acceptance logs, no verbose debug strings
  -DRICKYOS_GRAY_PRESET=0 ; the A4 keeps its 1.2.1 grays until checked on its UC8279C panel
custom_i18n_builtin_langs = ${rickyos_flash_trim.custom_i18n_builtin_langs}
custom_sdkconfig =
  ${eego_a4_hardware.custom_sdkconfig}
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256
  ; Font downloads from COS ran at ~34 KB/s: 91% of the time waiting for data (SD
  ; writes 6%), 2 KB per ~54 ms, the pattern of receive drops and retransmits. Larger
  ; receive buffers, a wider A-MPDU window, the RX path in IRAM and a 64 KB TCP window
  ; (the Plus took the same route). Costs ~13 KB more internal RAM for static buffers.
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=16
  CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=64
  CONFIG_ESP_WIFI_RX_BA_WIN=16
  CONFIG_ESP_WIFI_RX_IRAM_OPT=y
  CONFIG_LWIP_TCP_WND_DEFAULT=65534
  CONFIG_LWIP_TCP_RECVMBOX_SIZE=64
  CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=64

; --- Read Pico (小纸 Pico, RDP-G01-W) — ESP32-S3 N16R8, E0470A01 684x1216 ------
; Raw-parallel EPD with no on-glass controller: LovyanGFX Panel_EPD/Bus_EPD owns
; the 16-bit i80 bus and the SY7636A/FCA9555 rails come from BoardReadPico.
; USB Serial/JTAG is the console; the normal profile needs no USB MSC, so it
; extends the tuned core (which drops the prebuilt TinyUSB component graph).
;   pio run -e readpico -t upload
;
; !!! M5GFX IS PINNED BY GIT TAG, NOT BY REGISTRY — DO NOT "SIMPLIFY" THIS !!!
; `m5stack/M5GFX @ 0.2.20` does NOT resolve from the PlatformIO Registry, and a
; first `pio run -e readpico` confirmed it the hard way:
;   UnknownPackageError: Could not find the package with 'm5stack/M5GFX @ 0.2.20'
; The registry publishes only 0.1.17, 0.2.27, 0.2.28 and 0.2.29 for that package
; (https://api.registry.platformio.org/v3/packages/m5stack/library/M5GFX); the
; 0.2.20 release exists as a GIT TAG only (its library.json is served from the
; tag), never as a registry release.
;
; The git tag is pinned deliberately rather than moving to 0.2.29: every
; LovyanGFX Panel_EPD/Bus_EPD conclusion this port rests on — the LUT index
; being the TARGET level, the eraser preface, the step-framebuffer layout, the
; _lut_2pixel step budget — was verified against the 0.2.20 source tree
; (docs/engineering/read-pico.md §2.5, §2.6, and blocker B3). A registry bump
; would silently invalidate that evidence base, so if 0.2.29 is ever wanted,
; re-verify Panel_EPD.{hpp,cpp} and Bus_EPD.{h,cpp} at that revision FIRST and
; update the doc with the result.
;
; FLASH LAYOUT: the repo's partitions.csv (dual 6.25 MB OTA slots) and the
; board's factory partitions_16M.csv overlap at 0xE000 (otadata vs phy_init) and
; disagree on the app slot size (6.25 MB vs 2 MB), so a first installation is a
; FULL-table flash: bootloader@0x0, partitions@0x8000, boot_app0@0xe000,
; app@0x10000 — after a verified full-chip (16 MiB) backup. See
; docs/engineering/read-pico.md §3.8.
[readpico_hardware]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
lib_deps =
  ${s3_ble_psram.lib_deps}
  BoardReadPico=symlink://freeink-sdk/libs/hardware/BoardReadPico
  ; Read Pico's raw-parallel panel needs the LCD_CAM DE/HSYNC timing, so it links
  ; epdiy's LCD output path instead of M5GFX (see BoardConfig.h
  ; FREEINK_DRIVER_EPDIY_LCD). M5GFX is deliberately NOT here: leaving it in would
  ; link LovyanGFX's Bus_EPD/Panel_EPD for a board that no longer uses them.
  EpdiyLcd=symlink://freeink-sdk/libs/display/EpdiyLcd
extra_scripts = ${s3_ble_psram.extra_scripts}
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ${s3_ble_controller.custom_sdkconfig}
  ; --- Read Pico board-specific overrides -----------------------------------
  ; A1 (correctness): this board routes the CST836U touch INT# to the ESP32-S3's
  ; default U0TXD on GPIO43 (read_pico_board.h: "CST836U INT on TXD0 / GPIO43";
  ; the FPC adds a 10k pull-up because the tap is open-drain) and the TF card D0
  ; to U0RXD on GPIO44 (official pinout: CLK/CMD/D0 = 38/42/44). Leaving the IDF
  ; console on UART0 therefore claims both pins: the pad is driven as a UART TX
  ; against the controller's open-drain INT#, and our touch backend later steals
  ; the pad back with pinMode(INPUT_PULLUP), which kills the UART console. The
  ; vendor sdkconfig.defaults avoids this with CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
  ; and that is also what ARDUINO_USB_MODE=1 expects here.
  CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
  CONFIG_ESP_CONSOLE_UART_DEFAULT=n
  ; A2 (performance): the reader streams the framebuffer out of PSRAM row by row.
  ; The vendor tuning raises the S3 data cache for exactly that reason
  ; ("渲染线程逐行流式读 PSRAM 里的 framebuffer，cache 越大预取越不容易失效").
  ; Scoped to readpico: this board has the largest framebuffer in the tree
  ; (1216x684 -> 103,968 B) and already pays the 80 MHz PSRAM penalty (see §2.7),
  ; so it benefits most and no other env changes.
  CONFIG_ESP32S3_DATA_CACHE_64KB=y
  CONFIG_ESP32S3_DATA_CACHE_32KB=n
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  ; A3 (robustness): the vendor reserves 32 KB of internal RAM, and epdiy's LCD
  ; path needs it: ~45 KB of *contiguous internal* RAM goes to the 1 KiB phase
  ; LUT, the 304 B line mask, the 688-entry line-thread table, two 1216 B feed
  ; lines, the two 64 x 304 B line queues and the two 1224 B DMA bounce buffers.
  ; A general heap eating internal RAM turns that into a dead panel with no
  ; message, so keep the reserve.
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
  ; The panel owns the internal-DMA reserve above, while the WiFi/LWIP stack has
  ; ordinary 8-bit buffers that can safely live in the 8 MB PSRAM.  Prefer PSRAM
  ; for those buffers, falling back to internal SRAM only if PSRAM is unavailable.
  ; This is the vendor Read Pico setting and leaves network socket headroom for
  ; File Transfer without weakening the display reserve.
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  ; External BSS must be usable before Arduino initialization. Enable IDF
  ; PSRAM boot initialization together with the SDK network/Bluetooth BSS move.
  CONFIG_SPIRAM_BOOT_HW_INIT=y
  CONFIG_SPIRAM_BOOT_INIT=y
  CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
  ; A4 (robustness): the vendor raises the main task stack to 8 KB. This board's
  ; boot path runs the expander/PMIC bring-up, the CST836U reset dance and the
  ; panel bring-up on that task, and the eego A4 precedent shows the default 4 KB
  ; is not enough once a network step lands on it.
  CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192
build_flags =
  ${base.build_flags}
  ${s3_ble_psram.build_flags}
  -DFREEINK_DEVICE_READPICO=1
  -DCROSSMUX_UI_PROFILE_HIGH_DPI
  -DFREEINK_EPDIY_LCD_CONFIG=readPicoEpdiyConfig
  ; epdiy compiles as plain C with its own include roots (upstream ships them as
  ; an ESP-IDF component's INCLUDE_DIRS, and PlatformIO ignores that wrapper).
  ; Scoped to this env, so no other target's include path or binary changes.
  -I$PROJECT_DIR/freeink-sdk/libs/display/EpdiyLcd/src/epdiy/include
  -I$PROJECT_DIR/freeink-sdk/libs/display/EpdiyLcd/src/epdiy/src
  -I$PROJECT_DIR/freeink-sdk/libs/display/EpdiyLcd/src/e0470/include
  -I$PROJECT_DIR/freeink-sdk/libs/display/EpdiyLcd/src/e0470/waveforms
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1

; Reading + life tools: retain Gomoku, exclude other games/fun apps. Keep source and
; saved app IDs for upstream builds and future re-enablement; no SD data deletion.
[rickyos_app_profile]
build_src_filter =
  -<activities/apps/sudoku/>
  -<activities/apps/sokoban/>
  -<activities/apps/chinese-chess/>
  -<activities/apps/minesweeper/>
  -<activities/apps/2048/>
  -<activities/apps/avatar/>
  -<activities/apps/buddy/>
  -<activities/apps/pixel-switch/>
  -<activities/apps/woodfish/>
  -<activities/apps/airpage/>
  ; INX inherits shared Lyra/Base rendering; exclude only standalone alternatives.
  -<components/themes/lyra/Lyra3CoversTheme.cpp>
  -<components/themes/lyra/LyraCarouselTheme.cpp>
  -<components/themes/roundedraff/>

; Flash trim for the Chinese-first product: UI strings for Simplified Chinese plus the
; always-built English fallback, and English-only Liang hyphenation. A saved language
; outside this list shows English and is left untouched on the SD card.
[rickyos_flash_trim]
custom_i18n_builtin_langs = zh_cn
build_flags =
  -DHYPHENATION_ENGLISH_ONLY

; RickyOS product version (major.minor.patch, "-dev" between releases); independent
; of the CrossMux version above.
[rickyos]
version = 1.2.3

; Product derivative: keep upstream hardware/release environments unchanged.
[env:rickyos_readpico]
extends = readpico_hardware
; Keep the product build inside the dual-OTA slot as UI features (and USB 传书's
; TinyUSB component) grow. Other ESP32-S3 product profiles already use app LTO.
build_unflags =
  ${base.build_unflags}
  -fno-lto
extra_scripts =
  ; USB 传书 (SD card as a USB disk): the pinned TinyUSB component, before the build.
  pre:scripts/prepare_readpico_usb_component.py
  ${readpico_hardware.extra_scripts}
build_src_filter =
  ${base.build_src_filter}
  ${rickyos_app_profile.build_src_filter}
build_flags =
  ${readpico_hardware.build_flags}
  ${rickyos_flash_trim.build_flags}
  -flto=auto
  -DRICKYOS_PRODUCT=1
  -DCROSSPOINT_PRODUCT_NAME=\"RickyOS\"
  -DCROSSPOINT_VERSION=\"${rickyos.version}\"
  -DENABLE_SERIAL_LOG
  -DFREEINK_READPICO_DIAGNOSTICS=0 ; Keep the private IME trial within the guarded app-slot budget.
  -DLOG_LEVEL=1 ; Keep boot/reader acceptance logs while omitting verbose debug strings.
  -DFREEINK_CAP_USB_MSC=1 ; USB 传书, accepted on device for 1.2
  ; USB 传书: see every SCSI command (host-dropped detection) and answer the ones
  ; the Arduino core gets wrong (lib/hal/HalStorage.cpp).
  -Wl,--wrap=tud_msc_test_unit_ready_cb
  -Wl,--wrap=tud_msc_start_stop_cb
  -Wl,--wrap=tud_msc_scsi_cb
custom_i18n_builtin_langs = ${rickyos_flash_trim.custom_i18n_builtin_langs}
; RickyOS downloads fonts from hosts outside mainland China (~220 ms round trip).
; TCP throughput is capped near window / RTT, so the default 5,760 B window gave
; ~22 KB/s on the device. A 32 KiB window (and a receive mailbox deep enough to
; hold it) lifts that cap about sixfold; lwIP and WiFi buffers already prefer
; PSRAM (CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP), so internal RAM is not reserved.
custom_sdkconfig =
  ${readpico_hardware.custom_sdkconfig}
  CONFIG_LWIP_TCP_WND_DEFAULT=32768
  ; EPUB chapter layout makes thousands of small allocations (one per word). With
  ; the 4 KiB always-internal threshold they all landed in ~67 KB of internal RAM
  ; (min 10 KB seen on device) and larger chapters failed with "index failed",
  ; while the 8 MB PSRAM sat idle. Only tiny allocations stay internal now; the
  ; 32 KiB internal reserve for the panel's DMA buffers is unchanged.
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256
  CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_MSC_ENABLED=y
  CONFIG_TINYUSB_MSC_BUFSIZE=4096
  ; Serial logs stay on the S3 USB Serial/JTAG controller. USB 传书 exposes only
  ; an SD-card mass-storage interface through the USB OTG controller.
  CONFIG_TINYUSB_CDC_ENABLED=n
  CONFIG_TINYUSB_HID_ENABLED=n
  CONFIG_TINYUSB_MIDI_ENABLED=n
  CONFIG_TINYUSB_AUDIO_ENABLED=n
  CONFIG_TINYUSB_VIDEO_ENABLED=n
  CONFIG_TINYUSB_DFU_RT_ENABLED=n
  CONFIG_TINYUSB_DFU_ENABLED=n
  CONFIG_TINYUSB_VENDOR_ENABLED=n
  CONFIG_TINYUSB_NCM_ENABLED=n

; Perf builds: the shipped firmware plus one [PERF] line per measured event, read by
; tools/rickyos-perf/perf.py. For measuring on a device only; never released.
[env:rickyos_readpico_perf]
extends = env:rickyos_readpico
build_flags =
  ${env:rickyos_readpico.build_flags}
  -DRICKYOS_PERF=1

[env:rickyos_eego_a4_perf]
extends = env:rickyos_eego_a4
build_flags =
  ${env:rickyos_eego_a4.build_flags}
  -DRICKYOS_PERF=1
